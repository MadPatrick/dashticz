name: Update Playwright Snapshots

on:
  workflow_dispatch:
    inputs:
      spec_file:
        description: Spec file to update snapshots for
        required: false
        default: tests/domoticzblock.spec.js
        type: string
      browser:
        description: Browser project
        required: false
        default: chromium
        type: string

permissions:
  contents: write

jobs:
  update-snapshots:
    name: Update snapshots (${{ inputs.browser }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl
          coverage: none
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ inputs.browser }}
      - name: Start PHP test server
        run: |
          php -S 127.0.0.1:8082 -t . > php-server.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8082/ >/dev/null && exit 0
            sleep 1
          done
          cat php-server.log
          exit 1
      - run: npx playwright test --project=${{ inputs.browser }} ${{ inputs.spec_file }} --update-snapshots
        env:
          DASHTICZ_TEST_URL: http://127.0.0.1:8082
          DASHTICZ_BROWSER: ${{ inputs.browser }}
      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '**/*-snapshots/*.png'
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git status --cached
            git commit -m "Update Playwright ${{ inputs.browser }} snapshots for ${{ inputs.spec_file }}"
            git push
          fi
