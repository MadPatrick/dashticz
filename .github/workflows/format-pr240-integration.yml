name: Format PR 240 integration

on:
  push:
    branches: [beta-integration-pr-240]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta-integration-pr-240
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format integration files
        run: |
          npx prettier --config build/prettier.json --write js/components/lms.js js/components/lms.css
          if git diff --quiet -- js/components/lms.js js/components/lms.css; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/components/lms.js js/components/lms.css
          git commit -m "Format PR #240 integration"
          git push origin HEAD:beta-integration-pr-240
